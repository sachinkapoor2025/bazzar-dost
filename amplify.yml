# Next.js SSR storefront. The Amplify app platform must be WEB_COMPUTE.
# The API, DynamoDB, S3, CloudFront, and Cognito are deployed separately with SAM.
# baseDirectory must stay .next.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - NEXT_PUBLIC_SITE_URL=https://bazaardost.com npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
