# Next.js SSR. The Amplify app platform must be WEB_COMPUTE.
# baseDirectory must stay .next. Do not change it to out or public.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        - npx prisma migrate deploy
        - NEXT_PUBLIC_SITE_URL=https://bazaardost.com npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
